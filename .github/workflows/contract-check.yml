name: contract-check

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 文档表格 vs schema 一致性
        run: python scripts/check_contract.py
      - name: 样例日志校验（严格模式）
        run: python scripts/validate_log.py logs/sample_frames.jsonl --strict --summary
      - name: 读取脚本可用性
        run: python scripts/read_log.py logs/sample_frames.jsonl --head 3
      - name: Python 脚本语法检查
        run: python -m py_compile pc/probe_link.py tools/fake_esp32_probe.py scripts/validate_log.py scripts/read_log.py scripts/check_contract.py
      - name: 探针 ↔ 假节点 自测（本机回环，5 秒）
        run: |
          python tools/fake_esp32_probe.py --pattern good --ramp-s 2 &
          sleep 2
          python pc/probe_link.py --host 127.0.0.1 --udp-port 9000 --http-port 8080 --duration 5 --hz 10 --label ci --no-plot --out /tmp/traces
          ls -l /tmp/traces
