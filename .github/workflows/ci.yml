name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 文档表格 vs schema 一致性
        run: python scripts/check_contract.py
      - name: 样例日志校验（严格模式）
        run: python scripts/validate_log.py logs/sample_frames.jsonl --strict --summary
      - name: 读取脚本可用性
        run: python scripts/read_log.py logs/sample_frames.jsonl --head 3
      - name: Python 脚本语法检查
        run: python -m py_compile pc/probe_link.py pc/collect_dataset.py tools/fake_esp32_probe.py tools/panel_smoke.py tools/board_node.py tools/pc_collect.py ml/make_demo_traces.py ml/build_dataset.py ml/train_predictor.py panel/app.py scripts/validate_log.py scripts/read_log.py scripts/check_contract.py
      - name: 探针 ↔ 假节点 自测（本机回环，5 秒）
        run: |
          python tools/fake_esp32_probe.py --pattern good --ramp-s 2 &
          sleep 2
          python pc/probe_link.py --host 127.0.0.1 --udp-port 9000 --http-port 8080 --duration 5 --hz 10 --label ci --no-plot --out /tmp/traces
          ls -l /tmp/traces
      - name: 采集编排冒烟（假节点 + plans/ci_plan.json）
        run: |
          python tools/fake_esp32_probe.py --pattern good --ramp-s 2 &
          sleep 2
          python pc/collect_dataset.py --plan plans/ci_plan.json --host 127.0.0.1 --udp-port 9000 --http-port 8080 --yes --no-plot --out /tmp/collect
          test -s /tmp/collect/manifest.csv
          head -2 /tmp/collect/manifest.csv
      - name: 板端节点 ↔ 采集器自测（本机回环，3 秒带载；用 9100-9102 端口，不与上面的假节点冲突）
        run: |
          mkdir -p /tmp/board
          python tools/board_node.py --bind 127.0.0.1 --probe-port 9100 --ctrl-port 9102 --out /tmp/board > /tmp/board/node.log 2>&1 &
          sleep 1
          python tools/pc_collect.py run --board 127.0.0.1 --probe-port 9100 --ctrl-port 9102 --sink-port 9101 --sink-bind 127.0.0.1 --duration 3 --label ci --load 2mbps --out /tmp/board/out
          test -s /tmp/board/out/manifest.csv
          python -c "import csv; r = list(csv.DictReader(open('/tmp/board/out/manifest.csv')))[-1]; assert int(r['sent']) >= 50 and float(r['loss_rate']) < 0.05, r"
      - name: 面板冒烟（Streamlit AppTest，无需浏览器）
        run: |
          pip install --quiet streamlit plotly
          python tools/panel_smoke.py
      - name: ML 冒烟（合成数据：造数据 → 造样本 → 训练，不出图）
        run: |
          pip install --quiet scikit-learn joblib
          python ml/make_demo_traces.py --seconds 120 --out /tmp/demo_traces
          python ml/build_dataset.py --traces "/tmp/demo_traces/*.csv" --out /tmp/ds.csv
          python ml/train_predictor.py --data /tmp/ds.csv --split trace --seed 0 --no-plot --out /tmp/mlout
          test -s /tmp/mlout/model.joblib && test -s /tmp/mlout/metrics.json
